name: Build Quotile Android APK

# Builds the first upload and subsequent changes on main; manual runs remain available.
# This file does not create a repository or publish a release.
on:
  push:
    branches: [main, mobile-local]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install pinned Android SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools'
      - name: Verify sources and build debug APK
        run: python tools/build_android.py
      - name: Verify APK signature and manifest
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs dist/Quotile-0.2.0.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging dist/Quotile-0.2.0.apk
      - name: Build manual-mode instrumentation
        run: gradle --no-daemon --console=plain -p android :app:assembleDebugAndroidTest
      - name: Enable emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Check manual-only behavior on Android 16
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          ram-size: 3072M
          disk-size: 3G
          emulator-boot-timeout: 300
          disable-animations: true
          script: python tools/check_manual_android.py
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Quotile-0.2.0-debug
          path: dist/Quotile-0.2.0.apk
          if-no-files-found: error
          retention-days: 14
      - name: Note signing limitation
        run: |
          echo '### Debug signing' >> "$GITHUB_STEP_SUMMARY"
          echo 'Each clean runner creates a new debug key. APKs from different runs may require uninstalling the previous app, which clears its local settings. A stable release signing key is needed for reliable updates.' >> "$GITHUB_STEP_SUMMARY"

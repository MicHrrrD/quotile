name: Build Quotile Android APK

# Builds the first upload and subsequent changes on main; manual runs remain available.
# This file does not create a repository or publish a release.
on:
  push:
    branches: [main, mobile-local]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install pinned Android SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools'
      - name: Verify sources and build debug APK
        run: python tools/build_android.py
      - name: Verify APK signature and manifest
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs dist/Quotile-0.3.0.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging dist/Quotile-0.3.0.apk
      - name: Build manual-mode instrumentation
        run: gradle --no-daemon --console=plain -p android :app:assembleDebugAndroidTest
      - name: Free disk space for the Android emulator
        run: |
          # This Android-only job does not use the runner's preinstalled .NET SDK.
          sudo rm -rf /usr/share/dotnet
          df -h "$HOME"
      - name: Enable emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Check manual-only behavior on Android 16
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          ram-size: 3072M
          disk-size: 3G
          emulator-boot-timeout: 300
          disable-animations: true
          script: python tools/check_manual_android.py
      - name: Package official signing tool
        run: |
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" dist/apksigner.jar
          sha256sum dist/Quotile-0.3.0.apk dist/apksigner.jar > dist/build-sha256.txt
      - name: Upload tested build and preview images
        uses: actions/upload-artifact@v4
        with:
          name: Quotile-0.3.0-build
          path: |
            dist/Quotile-0.3.0.apk
            dist/apksigner.jar
            dist/build-sha256.txt
            design/android-previews/*.png
          if-no-files-found: error
          retention-days: 14
      - name: Note delivery signing
        run: |
          echo '### Delivery signing' >> "$GITHUB_STEP_SUMMARY"
          echo 'The build artifact contains a tested debug APK and the official Build Tools 35.0.0 signing JAR. Final delivery is signed locally with a separately retained private key using tools/sign_apk.py. Private signing material is never stored in this workflow or uploaded to the repository. The v0.2.0 ephemeral debug key is unavailable, so its installed app must be removed once before switching keys.' >> "$GITHUB_STEP_SUMMARY"

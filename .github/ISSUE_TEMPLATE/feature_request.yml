name: 功能建议
description: 描述想解决的使用问题
title: "[建议] "
body:
  - type: textarea
    id: need
    attributes:
      label: 希望解决什么问题
      description: 请说明使用场景和目前不方便的地方。
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: 期望的表现
      description: 可补充尺寸、交互或脱敏示意图。
